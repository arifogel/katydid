name: Renovate Bazel Lockfile Sync

on:
  pull_request_target:
    types: [opened, synchronize]
    paths:
      - "MODULE.bazel"
      - ".bazelrc"
      - ".bazelversion"

env:
  # Keep in sync with .github/workflows/ci.yaml's ROOT_VERSION.
  ROOT_VERSION: "6.40.04"

jobs:
  update-bazel-lockfile:
    # Only run on PRs opened or updated by Renovate
    if: github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          # Requires a PAT or App Token with repo write permissions
          token: ${{ secrets.PAT_WITH_WRITE_ACCESS }}

      # Regenerating MODULE.bazel.lock requires evaluating every module extension declared in
      # MODULE.bazel, including tools/system_deps.bzl's - which requires Boost, FFTW, MatIO,
      # and ROOT to actually be present on this runner, the same as the main CI workflow's
      # Ubuntu job. See ci.yaml for the reasoning behind this specific set of packages.
      - name: Install Boost/FFTW/MatIO/TBB
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libboost-filesystem-dev
            libboost-thread-dev
            libboost-date-time-dev
            libboost-program-options-dev
            libfftw3-dev
            libmatio-dev
            libtbb12
          version: 1.0

      - name: Cache ROOT
        id: cache-root-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/root
          key: root-linux-${{ env.ROOT_VERSION }}-ubuntu24.04-gcc13.3

      - name: Download and extract ROOT
        if: steps.cache-root-linux.outputs.cache-hit != 'true'
        run: |
          ROOT_URL="https://root.cern/download/root_v${ROOT_VERSION}.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz"
          wget -q -O /tmp/root.tar.gz "$ROOT_URL"
          tar -xzf /tmp/root.tar.gz -C /opt/

      - name: Add ROOT to PATH
        run: echo "/opt/root/bin" >> "$GITHUB_PATH"

      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Sync MODULE.bazel.lock
        run: bazel mod deps --lockfile_mode=update

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MODULE.bazel.lock
          git diff-index --quiet HEAD || (git commit -m "chore(bazel): update MODULE.bazel.lock" && git push)
