name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # The ROOT version used by the Ubuntu and AlmaLinux jobs below. Bump this (and nowhere else)
  # to change it - both jobs' download URLs are built from this value. Confirm any new version
  # is actually published for both platforms at https://root.cern/install/all_releases/ before
  # bumping.
  ROOT_VERSION: "6.40.04"

jobs:
  build-and-test:
    name: Bazel Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Linux: Boost, FFTW, and MatIO come from apt (which installs into locations the
      # compiler already searches by default, so no further configuration is needed - see
      # tools/system_deps.bzl). ROOT comes from a prebuilt binary published by the ROOT team,
      # since Ubuntu does not package a usable ROOT build.
      #
      # cache-apt-pkgs-action (rather than a plain `apt-get install`) caches these packages
      # across CI runs. libtbb12 is not one of Katydid's own dependencies - it is a runtime
      # dependency of the prebuilt `rootcling` binary fetched below, which (unlike the ROOT
      # builds installed via Homebrew on macOS) does not bundle its own copy of everything it
      # depends on.
      - name: Install Boost/FFTW/MatIO/TBB (Linux, cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libboost-filesystem-dev
            libboost-thread-dev
            libboost-date-time-dev
            libboost-program-options-dev
            libfftw3-dev
            libmatio-dev
            libtbb12
          version: 1.0

      - name: Cache ROOT (Linux)
        if: runner.os == 'Linux'
        id: cache-root-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/root
          key: root-linux-${{ env.ROOT_VERSION }}-ubuntu24.04-gcc13.3

      - name: Download and extract ROOT (Linux)
        if: runner.os == 'Linux' && steps.cache-root-linux.outputs.cache-hit != 'true'
        run: |
          ROOT_URL="https://root.cern/download/root_v${ROOT_VERSION}.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz"
          wget -q -O /tmp/root.tar.gz "$ROOT_URL"
          tar -xzf /tmp/root.tar.gz -C /opt/

      - name: Add ROOT to PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/opt/root/bin" >> "$GITHUB_PATH"

      # --- macOS: Homebrew is preinstalled on GitHub's runners, but ROOT, Boost, FFTW, and
      # MatIO are not, and are large enough downloads to be worth caching across CI runs even
      # though each run starts from a fresh virtual machine.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}
          restore-keys: |
            brew-cache-${{ runner.os }}

      - name: Install Boost/FFTW/MatIO/ROOT (macOS)
        if: runner.os == 'macOS'
        run: brew install boost fftw libmatio root

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Verify MODULE.bazel.lock is up to date, build, and test everything
        run: bazel build //... && bazel test //...

  # AlmaLinux 9 is tested as its own job, inside the official almalinux:9 container image,
  # rather than as a third value in the matrix above: GitHub Actions has a known issue
  # (https://github.com/actions/runner/issues/265) where using an empty `container:` value to
  # mean "run natively, no container" for some matrix combinations can fail workflow validation
  # outright. A fully separate job avoids that risk entirely.
  build-and-test-almalinux:
    name: Bazel Build (almalinux-9)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # AlmaLinux is a RHEL-family Linux distribution, using dnf (and the EPEL and CRB add-on
      # repositories) rather than apt. gcc-c++ and git are not Katydid dependencies as such -
      # they are needed for Bazel itself to work at all (a C++ compiler, and the `git` command
      # Bazel uses to fetch Katydid's own bundled dependencies), and are not present in this
      # minimal container image by default.
      #
      # xxhash-devel and tbb-devel are, like libtbb12 in the Ubuntu job above, not Katydid
      # dependencies either - they are runtime dependencies of the prebuilt `rootcling` binary
      # fetched below. matio-devel requires the EPEL repository; boost-devel, fftw-devel, and
      # tbb-devel are in AlmaLinux's own default repository. CRB is enabled in case any future
      # dependency needs it - enabling it costs nothing if unused.
      - name: Install build tools and Boost/FFTW/MatIO/TBB (dnf)
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=keepcache=True \
            gcc-c++ \
            git \
            wget \
            tar \
            boost-devel \
            fftw-devel \
            matio-devel \
            tbb-devel \
            xxhash-devel

      # keepcache=True above is needed for this cache to actually help: dnf deletes downloaded
      # packages after a successful install by default.
      - name: Cache dnf packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/dnf
          key: dnf-cache-almalinux9

      - name: Cache ROOT
        id: cache-root-almalinux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/root
          key: root-almalinux9-${{ env.ROOT_VERSION }}-gcc11.5

      - name: Download and extract ROOT
        if: steps.cache-root-almalinux.outputs.cache-hit != 'true'
        run: |
          ROOT_URL="https://root.cern/download/root_v${ROOT_VERSION}.Linux-almalinux9.8-x86_64-gcc11.5.tar.gz"
          wget -q -O /tmp/root.tar.gz "$ROOT_URL"
          tar -xzf /tmp/root.tar.gz -C /opt/

      # The prebuilt ROOT binary depends on a number of shared libraries that are not always
      # present on a fresh container image; missing ones surface as a build failure much later,
      # inside the actual Bazel build. This step catches all of them at once, right after
      # extracting ROOT, by asking the dynamic linker (ldd) to resolve rootcling's complete
      # dependency chain up front.
      - name: Check ROOT binaries for missing shared libraries
        run: |
          ROOT_LIBDIR=$(/opt/root/bin/root-config --libdir)
          MISSING=$(ldd /opt/root/bin/rootcling 2>&1 | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "Missing shared library dependencies for rootcling:"
            echo "$MISSING"
            echo "(ROOT lib directory: $ROOT_LIBDIR)"
            exit 1
          fi

      - name: Add ROOT to PATH
        run: echo "/opt/root/bin" >> "$GITHUB_PATH"

      # bazel-contrib/setup-bazel's usual automatic Bazel installation does not reliably work
      # inside this minimal container image, so Bazelisk (the tool that installs the correct
      # Bazel version automatically) is installed directly here instead, using the standard
      # installation method documented by the Bazel project itself.
      - name: Install Bazelisk directly (works regardless of what setup-bazel's installer needs)
        run: |
          wget -q -O /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

      # Caches the actual Bazel release binary that Bazelisk downloads (much larger than
      # Bazelisk itself), in case setup-bazel's own caching does not take effect reliably in
      # this container the way it does on the native runners above.
      - name: Cache Bazelisk's downloaded Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.cache/bazelisk
          key: bazelisk-cache-almalinux9-${{ hashFiles('.bazelversion') }}

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Verify MODULE.bazel.lock is up to date, build, and test everything
        run: bazel build //... && bazel test //...

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Cache Pre-Commit Hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Pre-Commit Framework
        run: pip install pre-commit

      - name: Execute Format Validations
        run: pre-commit run --all-files
