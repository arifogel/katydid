name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Bazel Build (${{ matrix.os }}, ${{ matrix.compilation_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        compilation_mode: [fastbuild]
        include:
          # dbg and opt get special-cased handling in the Bazel build (see .bazelrc's
          # STANDARD define and KTLogger's own NDEBUG/STANDARD-gated verbosity floor) that
          # fastbuild alone never exercises - dbg is also specifically the mode CLion's
          # Bazel plugin uses when debugging, and opt is what actual production runs use.
          # One OS is enough to catch a regression in either; this logic is not
          # platform-specific, so it isn't worth tripling the full OS matrix for it.
          - os: ubuntu-24.04
            compilation_mode: dbg
          - os: ubuntu-24.04
            compilation_mode: opt

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Linux: Boost, FFTW, and MatIO come from apt (which installs into locations the
      # compiler already searches by default, so no further configuration is needed - see
      # tools/system_deps.bzl). ROOT is fetched directly by tools/system_deps.bzl (a prebuilt
      # binary published by the ROOT team, since Ubuntu does not package a usable ROOT build),
      # not by a separate CI step - Bazel's repository cache covers it.
      #
      # libtbb12 and libblas3 are not Katydid's own dependencies - they are runtime
      # dependencies of ROOT's own prebuilt binaries and shared libraries (rootcling itself
      # needs libtbb12; every test binary here links ROOT's shared libraries, which need
      # libblas3), which (unlike the ROOT build installed via Homebrew on macOS) does not
      # bundle its own copy of everything it depends on. A missing one here doesn't show up
      # until every single test fails at runtime with a bare "Exit 127" - see the "Check a
      # built test binary" step below, which exists specifically to catch this class of
      # problem with a clear error message instead.
      #
      # Caches just the downloaded .deb files, keyed directly on a hash of this file, rather
      # than a third-party action (e.g. awalsh128/cache-apt-pkgs-action) that computes its own
      # cache key internally from the package list: such an action's own key computation is
      # opaque and can go stale silently -- GitHub Actions' own cache fallback mechanism ("the
      # default branch cache is available to other branches") can then serve an outdated cache
      # across branches with no error, a documented, repeatedly-reported problem for that
      # specific action (e.g. awalsh128/cache-apt-pkgs-action#138, #56). This key is correct by
      # construction instead, since it changes if and only if this file - which is the only
      # place the package list lives - changes. `apt-get install` itself is fast and safe to
      # run unconditionally even on a cache hit, since apt already skips re-downloading
      # packages it finds in its local archive cache and skips reinstalling packages already
      # at the requested version.
      - name: Cache downloaded .deb files (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives
          key: apt-archives-${{ hashFiles('.github/workflows/ci.yaml') }}

      - name: Install Boost/FFTW/MatIO runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libboost-filesystem-dev \
            libboost-thread-dev \
            libboost-date-time-dev \
            libboost-program-options-dev \
            libfftw3-dev \
            libmatio-dev \
            libtbb12 \
            libblas3
          # lock and partial/ are apt's own root-owned runtime bookkeeping, not downloaded
          # package files - the cache step above only wants the actual .deb files. Left in
          # place, both are unreadable by the (non-root) runner user, and the post-job cache
          # save step fails outright trying to archive them ("Permission denied"), taking the
          # whole cache down with it rather than just skipping these two paths.
          sudo rm -f /var/cache/apt/archives/lock
          sudo rm -rf /var/cache/apt/archives/partial

      # --- macOS: Homebrew is preinstalled on GitHub's runners, but Boost, FFTW, and MatIO
      # are not, and are large enough downloads to be worth caching across CI runs even
      # though each run starts from a fresh virtual machine. ROOT is fetched directly by
      # tools/system_deps.bzl, not brew - Bazel's repository cache covers it.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}
          restore-keys: |
            brew-cache-${{ runner.os }}

      - name: Install Boost/FFTW/MatIO (macOS)
        if: runner.os == 'macOS'
        run: brew install boost fftw libmatio

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          # Without this, all three ubuntu-24.04 variants (fastbuild/dbg/opt) compute an
          # identical disk-cache key (setup-bazel's own cache key is scoped by platform/arch,
          # not by anything specific to this workflow's matrix), and race to save to the same
          # slot - not a correctness risk, since Bazel's disk cache is content-addressed
          # internally, but only one of the three would actually persist between CI runs,
          # non-deterministically. This gives each compilation mode its own cache namespace.
          cache-version: ${{ matrix.compilation_mode }}

      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build -c ${{ matrix.compilation_mode }} //...

      # Every cc_test binary here links ROOT's shared libraries transitively (even a target
      # with no ROOT-specific code of its own, via katydid_utility). A missing one here fails
      # every single test uniformly with a bare "Exit 127", regardless of what that test
      # actually depends on, which is easy to mistake for a real bug in the test itself.
      - name: Check a built test binary for missing shared libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          MISSING=$(ldd bazel-bin/Source/Executables/Validation/TestVector 2>&1 | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "Missing shared library dependencies for TestVector:"
            echo "$MISSING"
            exit 1
          fi

      - name: Test everything
        run: bazel test -c ${{ matrix.compilation_mode }} //...
  # rather than as a third value in the matrix above: GitHub Actions has a known issue
  # (https://github.com/actions/runner/issues/265) where using an empty `container:` value to
  # mean "run natively, no container" for some matrix combinations can fail workflow validation
  # outright. A fully separate job avoids that risk entirely.
  build-and-test-almalinux:
    name: Bazel Build (almalinux-9)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # keepcache=True below is needed for this cache to actually help: dnf deletes downloaded
      # packages after a successful install by default. Keyed on a hash of this file (which is
      # the only place the package list lives), matching "Cache downloaded .deb files (Linux)"
      # in the Ubuntu job above: a static key would never refresh if the package list itself
      # changed.
      - name: Cache dnf packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/dnf
          key: dnf-cache-almalinux9-${{ hashFiles('.github/workflows/ci.yaml') }}

      # AlmaLinux is a RHEL-family Linux distribution, using dnf (and the EPEL and CRB add-on
      # repositories) rather than apt. gcc-c++ and git are not Katydid dependencies as such -
      # they are needed for Bazel itself to work at all (a C++ compiler, and the `git` command
      # Bazel uses to fetch Katydid's own bundled dependencies), and are not present in this
      # minimal container image by default.
      #
      # xxhash-devel and tbb-devel are, like libtbb12 in the Ubuntu job above, not Katydid
      # dependencies either - they are runtime dependencies of the prebuilt `rootcling` binary
      # tools/system_deps.bzl fetches directly (Bazel's repository cache covers it, so there's
      # no separate CI download/extract/check step for ROOT here). freetype and gsl are the
      # same category again, but for ROOT's own shared
      # libraries rather than rootcling specifically: every test binary here links ROOT, which
      # needs both at runtime (font rendering and linear algebra, respectively). A missing one
      # here doesn't show up until every single test fails at runtime with a bare "Exit 127" -
      # see the "Check a built test binary" step below, which exists specifically to catch this
      # class of problem with a clear error message instead. matio-devel requires the EPEL
      # repository; boost-devel, fftw-devel, tbb-devel, freetype, and gsl are in AlmaLinux's own
      # default repository. CRB is enabled in case any future dependency needs it - enabling it
      # costs nothing if unused.
      - name: Install build tools and Boost/FFTW/MatIO runtime deps (dnf)
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=keepcache=True \
            gcc-c++ \
            git \
            wget \
            tar \
            boost-devel \
            fftw-devel \
            matio-devel \
            tbb-devel \
            xxhash-devel \
            freetype \
            gsl

      # bazel-contrib/setup-bazel's usual automatic Bazel installation does not reliably work
      # inside this minimal container image, so Bazelisk (the tool that installs the correct
      # Bazel version automatically) is installed directly here instead, using the standard
      # installation method documented by the Bazel project itself.
      - name: Install Bazelisk directly (works regardless of what setup-bazel's installer needs)
        run: |
          wget -q -O /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

      # Caches the actual Bazel release binary that Bazelisk downloads (much larger than
      # Bazelisk itself), in case setup-bazel's own caching does not take effect reliably in
      # this container the way it does on the native runners above.
      - name: Cache Bazelisk's downloaded Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.cache/bazelisk
          key: bazelisk-cache-almalinux9-${{ hashFiles('.bazelversion') }}

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          # setup-bazel saves each cache type only once, ever, per exact key (its own
          # upstream issue #171), and its post step runs on !cancelled(), not success()
          # (its own PR #128) -- so a job that fails early, before doing much real work,
          # can still permanently lock in a near-empty cache under that key, with no later,
          # successful run able to overwrite it. cache-version below gives this job a key
          # of its own to recover from that.
          cache-version: almalinux9

      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build //...

      # See the equivalent step in the Ubuntu/macOS job above for why this checks a test
      # binary specifically.
      - name: Check a built test binary for missing shared libraries
        run: |
          MISSING=$(ldd bazel-bin/Source/Executables/Validation/TestVector 2>&1 | grep "not found" || true)
          if [ -n "$MISSING" ]; then
            echo "Missing shared library dependencies for TestVector:"
            echo "$MISSING"
            exit 1
          fi

      - name: Test everything
        run: bazel test //...

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Cache Pre-Commit Hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Pre-Commit Framework
        run: pip install pre-commit

      - name: Execute Format Validations
        run: pre-commit run --all-files
