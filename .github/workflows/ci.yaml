name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Bump this (and nowhere else) to change the pinned Linux ROOT version. Confirmed against
  # root.cern's own release page as a real, current binary distribution for Ubuntu 24.04 -
  # https://root.cern/releases/release-64004/ - not just a URL that happens to resolve.
  ROOT_VERSION: "6.40.04"

jobs:
  build-and-test:
    name: Bazel Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Linux: apt for Boost/FFTW/MatIO (installs into default search paths, no discovery
      # needed - see tools/system_deps.bzl), pinned root.cern tarball for ROOT (apt has no
      # usable ROOT package on Ubuntu, and building it from source is not reasonable for CI).
      # Deliberately NOT using install-ubuntu-24.04-build-deps.sh's equivs/.deb machinery here -
      # that exists for clean removal on a persistent dev machine, which is moot on a runner
      # that's destroyed after the job anyway.
      #
      # cache-apt-pkgs-action (not plain apt-get) so these are cached across runs too, same
      # reasoning as the ROOT/Homebrew caching below - libmatio-dev alone pulls in libhdf5-dev
      # transitively, which isn't a small download either.
      #
      # libtbb12 isn't one of Katydid's own dependencies - it's needed because the prebuilt
      # rootcling binary (from the ROOT tarball below) dynamically links against libtbb.so.12,
      # and root.cern's raw tarball doesn't bundle/relocate it the way Homebrew's bottles do.
      # Once it's an ordinary apt package it lands in the default linker search path
      # automatically - no LD_LIBRARY_PATH or rpath juggling needed.
      - name: Install Boost/FFTW/MatIO/TBB (Linux, cached)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            libboost-filesystem-dev
            libboost-thread-dev
            libboost-date-time-dev
            libboost-program-options-dev
            libfftw3-dev
            libmatio-dev
            libtbb12
          version: 1.0

      - name: Cache ROOT (Linux)
        if: runner.os == 'Linux'
        id: cache-root-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/root
          key: root-linux-${{ env.ROOT_VERSION }}-ubuntu24.04-gcc13.3

      - name: Download and extract ROOT (Linux)
        if: runner.os == 'Linux' && steps.cache-root-linux.outputs.cache-hit != 'true'
        run: |
          ROOT_URL="https://root.cern/download/root_v${ROOT_VERSION}.Linux-ubuntu24.04-x86_64-gcc13.3.tar.gz"
          wget -q -O /tmp/root.tar.gz "$ROOT_URL"
          tar -xzf /tmp/root.tar.gz -C /opt/

      - name: Add ROOT to PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/opt/root/bin" >> "$GITHUB_PATH"

      # --- macOS: Homebrew is preinstalled on the runner, but root/boost/fftw/libmatio are not,
      # and (like the Linux ROOT tarball) brew's own bottle downloads are large enough on a
      # fully ephemeral runner to be worth caching across runs.
      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-cache-${{ runner.os }}
          restore-keys: |
            brew-cache-${{ runner.os }}

      - name: Install Boost/FFTW/MatIO/ROOT (macOS)
        if: runner.os == 'macOS'
        run: brew install boost fftw libmatio root

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      # --lockfile_mode=error is the bzlmod analog of "verify go.sum is tidy": fails loudly if
      # MODULE.bazel.lock doesn't match what resolution would produce, rather than silently
      # updating it or building against a stale lock.
      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build --lockfile_mode=error //...

  # Separate job, not a third matrix entry: GitHub Actions has a known, still-open issue
  # (actions/runner#265) where using an empty-string `container:` value to mean "no container"
  # on some matrix entries can fail workflow validation outright. Not worth that risk against
  # the two platforms that already work - this stays fully independent, always containerized.
  build-and-test-almalinux:
    name: Bazel Build (almalinux-9)
    runs-on: ubuntu-latest
    container:
      image: almalinux:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # AlmaLinux 9 (RHEL family, dnf/EPEL) inside the official almalinux:9 container image -
      # GitHub has no native AlmaLinux runner. gcc-c++ is needed for Bazel's own C++ toolchain
      # autodetection to find a compiler at all in this minimal image - not a Katydid dependency
      # itself. git is likewise not a Katydid dependency directly - it's needed because
      # tools/non_bazel_deps.bzl fetches Nymph/Scarab/Cicada/rapidjson/yaml-cpp via Bazel's
      # git_repository rule, which shells out to a real `git` binary; the minimal almalinux:9
      # image doesn't include one by default (confirmed by the actual failure: "execvp(git, ...):
      # No such file or directory"). Package names confirmed against the real AlmaLinux/EPEL package index, not
      # assumed: boost-devel/fftw-devel/tbb-devel are all in AlmaLinux 9's own AppStream repo;
      # matio-devel specifically needs EPEL (isn't in AppStream or CRB). CRB is enabled
      # defensively even though none of these four appear to need it - costs nothing if unused,
      # and RHEL's -devel-package-to-repo mapping isn't worth risking a first-run failure over.
      # Container jobs run as root by default, so no sudo (and this minimal image may not even
      # have it installed).
      - name: Install build tools and Boost/FFTW/MatIO/TBB (dnf)
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf install -y --setopt=keepcache=True \
            gcc-c++ \
            git \
            wget \
            tar \
            boost-devel \
            fftw-devel \
            matio-devel \
            tbb-devel

      # keepcache=True above so downloaded RPMs survive a successful install (dnf's default is
      # to delete them afterward) - otherwise this cache would restore nothing useful.
      - name: Cache dnf packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/dnf
          key: dnf-cache-almalinux9

      # root.cern's binary specifically targets AlmaLinux 9.8 (matches your actual Wulf cluster's
      # 9.7 too - RHEL-family point releases are ABI-stable within a major version by design, so
      # a 9.8 build runs identically on 9.7). Same ROOT_VERSION as the Ubuntu job above.
      - name: Cache ROOT
        id: cache-root-almalinux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /opt/root
          key: root-almalinux9-${{ env.ROOT_VERSION }}-gcc11.5

      - name: Download and extract ROOT
        if: steps.cache-root-almalinux.outputs.cache-hit != 'true'
        run: |
          ROOT_URL="https://root.cern/download/root_v${ROOT_VERSION}.Linux-almalinux9.8-x86_64-gcc11.5.tar.gz"
          wget -q -O /tmp/root.tar.gz "$ROOT_URL"
          tar -xzf /tmp/root.tar.gz -C /opt/

      - name: Add ROOT to PATH
        run: echo "/opt/root/bin" >> "$GITHUB_PATH"

      # bazel-contrib/setup-bazel's automatic bazelisk installation didn't produce a working
      # `bazel` on PATH inside this minimal container image (exact cause unconfirmed - possibly
      # a missing tool its installer expects, possibly something else container-specific). Rather
      # than debug that action's internals blind, install bazelisk explicitly and directly -
      # this is the standard, widely-used pattern for exactly this situation (see e.g. Envoy's
      # and IREE's own build docs, which do the identical wget-and-chmod).
      - name: Install Bazelisk directly (works regardless of what setup-bazel's installer needs)
        run: |
          wget -q -O /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel

      # bazel-contrib/setup-bazel's own bazelisk-cache option *should* cover this, but its
      # install logic already misbehaved once in this exact container (see the step above) -
      # not assuming its caching logic is any more trustworthy here without separate
      # confirmation. This is the actual expensive thing worth caching (a full Bazel release
      # binary, 50-80MB+) - bazelisk itself is tiny and not worth caching on its own.
      # Directory per bazelisk's own convention (Go's os.UserCacheDir(): $XDG_CACHE_HOME/bazelisk,
      # else $HOME/.cache/bazelisk - root's HOME here, since container jobs run as root).
      - name: Cache Bazelisk's downloaded Bazel binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /root/.cache/bazelisk
          key: bazelisk-cache-almalinux9-${{ hashFiles('.bazelversion') }}

      - name: Set up Bazel & Caching
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true

      - name: Verify MODULE.bazel.lock is up to date and build everything
        run: bazel build --lockfile_mode=error //...

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      - name: Cache Pre-Commit Hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install Pre-Commit Framework
        run: pip install pre-commit

      - name: Execute Format Validations
        run: pre-commit run --all-files
