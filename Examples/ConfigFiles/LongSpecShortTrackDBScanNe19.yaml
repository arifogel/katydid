processor-toolbox:

    processors:
        - { type: "long-spec-processor",             name: "spec1" }
        - { type: "long-spec-processor",             name: "spec2" }
        - { type: "data-accumulator",                name: "acc" }
        - { type: "gain-variation",                  name: "gainvar" }
        - { type: "variable-spectrum-discriminator", name: "discrim" }
        - { type: "sequential-track-finder",         name: "seq-tr-find"}
        - { type: "track-proc-ws",                   name: "tr-proc-ws"}
        - { type: "dbscan-event-clustering",         name: "dbscan"}
        - { type: "basic-root-writer",               name: "brw" }
        - { type: "root-spectrogram-writer",         name: "rsw"}
        - { type: "root-tree-writer",                name: "rtw"}
   
    connections:
              # Take the power spectra from the input file and send them to accumulator
            - signal: "spec1:ps"         
              slot: "acc:ps"

              # Copy the accumulated power spectra to gain variation
            - signal: "acc:ps-finished"  
              slot: "gainvar:ps-var"

              # Write the accumulated power spectra to ROOT file
            - signal: "acc:ps-finished"  
              slot: "brw:ps"

              # Write the gain-var histogram to ROOT file 
            - signal: "gainvar:gain-var" 
              slot: "brw:gain-var"

              # Copy the gain-var histogram to the discriminator
            - signal: "gainvar:gain-var"
              slot: "discrim:gv"

              # Take the power spectra from the second input file and write them to a ROOT file
            - signal: "spec2:ps"
              slot: "rsw:ps"

              # Copy the power spectra from the second input file to the discriminator
            - signal: "spec2:ps"
              slot: "discrim:ps-pre"
 
              # Write the spectrogram of points that are above discrim. threshold to ROOT file 
            - signal: "discrim:disc-1d"
              slot: "rtw:disc-1d"

              # Pass sparse spectrogram to clustering algorithm for event ID
            - signal: "discrim:disc-1d"
              slot: "seq-tr-find:disc-1d"

              # Send signal to clustering algorithm at end of input to check remaining clusters
            - signal: "spec2:spec-done"
              slot: "seq-tr-find:done"
              
              # Process tracks
            - signal: "seq-tr-find:seq-cand"
              slot: "tr-proc-ws:seq-cand"
              
              # Write processed tracks to a ROOT tree
            - signal: "tr-proc-ws:track"
              slot: "rtw:proc-track"
              
              # Start merging collinear track segments when sequential track finder is complete
            - signal: "seq-tr-find:clustering-done"
              slot: "dbscan:do-clustering"
              
              #Cluster short track segments with the dbscan algorithm
            - signal: "tr-proc-ws:track"
              slot: "dbscan:track"
              
              # Writing the Events to a ROOT file (you can use rtw for all datatypes. Look for slot names in .cc files)
            - signal: "dbscan:event"
              slot: "rtw:mt-event"
              
              # Make sure to send the spec-done signal so the ROOT file gets written
            - signal: "spec2:spec-done"
              slot: "rsw:write-file"
 
    run-queue:
        - spec1
        - spec2

spec1:
    filename: "/media/heather/T7/SpecFiles/KrTest_02232022/Freq_data_2022-03-01-14-23-49.spec" #U side noise
    spectra: 170   #number of OUTPUT specs after averaging
    packets-per-spec: 4
    header-bytes: 32
    ROACH-spect-avg: 2
    freq-bins-per-packet: 8192
    min-freq: 0.0e6
    max-freq: 1200.0e6
    time-slice-avg: 1
    freq-bin-avg: 10   #must be a power of 2  -- adjust discrim and gainvar accordingly!

spec2:
    filename: "/media/heather/T7/SpecFiles/KrTest_02232022/Freq_data_2022-03-01-14-23-49.spec"
    spectra: 18000 #number of OUTPUT specs after averaging 18000 max
    packets-per-spec: 4
    header-bytes: 32
    ROACH-spect-avg: 2
    freq-bins-per-packet: 8192
    min-freq: 0.0e6
    max-freq: 1200.0e6
    time-slice-avg: 1 #Time slice width = 54.6 usec (two 27.3 usec slices averaged by the ROACH = 54.6 usec) Thus 1 freq bin/1 time bin = 1.34×10^9 Hz/s
    freq-bin-avg: 10   #freq bin size = 366.2 kHz (36.62 kHz *10 here) Num to average must be a power of 2  -- adjust discrim and gainvar accordingly!


brw:
    output-file: "/media/heather/T7/KatydidOutput/KrTest_02232022/Freq_data_2022-03-01-14-23-49.root"
    file-flag: "recreate"

rsw:
    output-file: "/media/heather/T7/KatydidOutput/KrTest_02232022/Freq_data_2022-03-01-14-23-49.root"
    file-flag: recreate
    mode: single
    min-time: 0.0
    max-time: 0.15
    min-freq: 0.0e6
    max-freq: 1200.0e6

rtw:
    output-file: "/media/heather/T7/KatydidOutput/KrTest_02232022/Freq_data_2022-03-01-14-23-49.root"
    file-flag: recreate

acc:
    number-to-average: 2
    signal-interval: 2

gainvar:
    normalize: false
    min-bin: 273
    max-bin: 3275
    fit-points: 100

discrim:
    min-bin: 273
    max-bin: 3275
    snr-threshold-power: 2.2 # Kr 4.2

seq-tr-find:
    min-frequency: 100.0e6 # minimum frequency (in Hz)
    max-frequency: 1195.0e6 # maximum frequency (in Hz)
    initial-slope : 8.0e9 # slope of a track with 1 point (in Hz/s)
    slope-method: weighted-first-point-ref # method to update line slope after point collection
    n-slope-points: 10 # max points to include in the slope calculation
    time-gap-tolerance: 6.0e-4 # max gap between points in a line (in sec.) one time slice is 5.46×10^-5 seconds
    frequency-acceptance: 9.0e5 # max freq gap between point and extrapolated line (in Hz) Each frequency bin is 3.6e4, so it needs to be more than that or all tracks will have a slope of 1 freq bin/1 time bin = 3.352×10^8
    trimming-threshold: 1  # snr threshold for the first and last point of a candidate
    min-points: 2 # line is converted to a track iff it has >= this # of points
    max-points: 10 # longest track allowed. Use for curved tracks!
    min-slope: 0 # line is converted to a track iff line slope is > than this (in Hz/s)

tr-proc-ws:
    min-slope: 0 # min slope (Hz/s)
    min-points: 3 # min points required to keep a processed track (fixed -H)
    
dbscan:
    radii: [1.0e-3,2.0e6] #double[2] -- array used to describe the distances that will be used to cluster tracks together; [time, frequency] [1.0e-3,2.0e6]
    min-points: 2 #minimum number of tracks required to have a cluster



